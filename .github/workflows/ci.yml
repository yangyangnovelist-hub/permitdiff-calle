name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: HTML semantics
        run: npx -y html-validate@11.11.0 docs/index.html src/permitdiff/operator.html

      - name: Dependency vulnerability audit
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt | uvx pip-audit==2.10.1 -r /dev/stdin

      - name: Safety regression suite
        run: uv run pytest --cov=src/permitdiff --cov-report=term-missing --cov-fail-under=90
